name: Traceability

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ecom_ref:
        description: 'Branch, tag or SHA of the application repository'
        required: false
        default: ''

permissions:
  contents: read

env:
  # The application branch under test. The tests assert the fixed behaviour, so this must be a branch that contains the application's fixes. Change it to the default branch once the fixes are merged there.
  ECOM_REF: qa-test-automation

jobs:
  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mirzamaazbaig/ecommerce-test-automation
          ref: ${{ inputs.ecom_ref || env.ECOM_REF }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests of the tool
        run: pytest -q

      - name: Check the requirements against the real tests
        run: python tools/traceability.py --app-repo app

      - name: The committed matrix must be up to date
        run: git diff --exit-code docs/TRACEABILITY.md
